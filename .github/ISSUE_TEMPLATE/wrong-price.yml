name: Wrong price
description: Report an incorrect fuel price
title: "[price] "
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Maintainers can apply a **24-hour overlay** in
        `data/overrides/prices.json` (OSM `stationId` or address). Live LEA still
        wins if it updates later the same day.
  - type: input
    id: station
    attributes:
      label: Station name / address
    validations:
      required: true
  - type: input
    id: station_id
    attributes:
      label: OSM station id (if you know it)
      description: e.g. osm:way:138809868 — from the station popup URL or stations.json
  - type: dropdown
    id: fuel
    attributes:
      label: Fuel
      options: ["95", "98", "D", "LPG"]
    validations:
      required: true
  - type: input
    id: shown
    attributes:
      label: Price shown on the site (€/l)
  - type: input
    id: actual
    attributes:
      label: Price at the pump (€/l)
    validations:
      required: true
  - type: input
    id: seen_at
    attributes:
      label: When you saw the pump (Vilnius time)
      placeholder: 2026-09-17 14:30
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
