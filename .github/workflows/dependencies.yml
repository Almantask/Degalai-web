name: Dependencies

# Calls every outside service the site, the data pipeline and the cron worker depend on, through
# the same code (tests/deps/). A red run means one moved, changed shape or stopped answering.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  # Any branch, when code that calls a dependency (or the tests) changes.
  push:
    paths:
      - "tests/deps/**"
      - "vitest.deps.config.ts"
      - "scripts/adapters/**"
      - "scripts/osm.ts"
      - "scripts/geocode.ts"
      - "src/routing.ts"
      - "src/map.ts"
      - "worker/**"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci --ignore-scripts
      # Wrangler, which the Cloudflare credential tests run as the worker deploy does.
      - run: npm ci --ignore-scripts
        working-directory: worker
      - run: npm run test:deps
        env:
          # Lifts the GitHub API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Each is used by the code that uses it (tests/deps/credentials.test.ts); empty fails.
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_URL: ${{ vars.REPORT_URL }}
          # Optional: without it the site routes with OSRM and this test skips.
          VITE_ORS_KEY: ${{ secrets.ORS_KEY }}
