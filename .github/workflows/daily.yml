name: Daily data + deploy

on:
  schedule:
    # 06:00 Lithuania time (EEST)
    - cron: "0 3 * * *"
    # 14:45 Lithuania time (EEST)
    - cron: "45 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Data-only commits from this workflow already build+deploy in the same run.
    paths-ignore:
      - "data/**"
      - "reports/**"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run data pipeline
        if: github.event_name != 'push'
        run: npm run pipeline -- --backfill
      - name: Commit data if changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/stations.json \
            data/history.json \
            data/meta.json \
            data/prices \
            data/overrides \
            data/cache/.gitkeep \
            data/cache/geocode.json \
            reports/unmatched.json \
            reports/validation.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: $(TZ=Europe/Vilnius date +%F)"
            git push
          fi
      - run: npm run build
        env:
          BASE_URL: /Degalai-web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failed ${new Date().toISOString().slice(0, 10)}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline",
            });
            if (issues.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["pipeline"],
              body: `Daily pipeline failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  deploy:
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
