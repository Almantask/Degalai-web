name: Hourly data + deploy

on:
  # The hourly trigger is a Cloudflare Worker cron (see worker/) calling workflow_dispatch:
  # GitHub's own schedule drifts, drops runs, and is disabled after 60 days without commits.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Pipeline state (price snapshots, hourly history samples, geocode cache) lives in the
      # Actions cache, not git. The committed data/ is only a seed for when the cache is gone.
      - name: Restore pipeline state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            reports
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-
      - name: Run data pipeline
        run: |
          if [ -z "${{ steps.state.outputs.cache-matched-key }}" ]; then
            echo "::warning::No cached pipeline state; starting from committed seed data with backfill."
            npm run pipeline -- --backfill
          else
            npm run pipeline
          fi
      - name: Save pipeline state
        uses: actions/cache/save@v4
        with:
          path: |
            data
            reports
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
        env:
          BASE_URL: /Degalai-web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failed ${new Date().toISOString().slice(0, 10)}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline",
            });
            if (issues.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["pipeline"],
              body: `Hourly pipeline failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  deploy:
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
