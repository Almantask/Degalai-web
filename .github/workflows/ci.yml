name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_URL: /Degalai-web/
