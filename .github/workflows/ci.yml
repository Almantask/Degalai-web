name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called on a branch to check a change there, browser tests included
  # (.claude/skills/ci-checks/SKILL.md).
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm test
      - name: Dependency wiring (offline)
        run: npm run test:deps -- wiring
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_URL: /Degalai-web/

  e2e:
    # Only when called: these load the map tiles and drive a real browser.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
